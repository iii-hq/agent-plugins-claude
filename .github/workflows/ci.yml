name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Before install: the committed CLI must match its sources as committed.
      - name: Committed CLI is up to date
        run: node scripts/build.mjs --check

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test

      - name: Validate the marketplace and the plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          claude plugin validate .
          claude plugin validate plugins/iii
